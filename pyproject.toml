[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "china-cars"
version = "0.1.0"
description = "Projeto de engenharia e analise de dados com DuckDB, Excel e dashboard interativo."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0.0",
  "pandas>=2.2.0",
  "pyarrow>=15.0.0",
  "openpyxl>=3.1.0",
  "xlsxwriter>=3.2.0",
  "pyyaml>=6.0.0",
  "streamlit>=1.36.0",
  "plotly>=5.22.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

