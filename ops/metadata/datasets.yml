datasets:
  raw:
    - name: raw_anfavea_registrations
      source: ANFAVEA
      path: data/raw/anfavea/
      format: xlsx
      grain: monthly by company/brand when available
      owner: A definir
      update_frequency: monthly
      pii: false
      notes: >-
        Workbook anual "Emplacamento por empresa" abre apenas empresas associadas;
        marcas chinesas como BYD e GWM ficam na linha agregada "Outras empresas".
        O detalhe por marca vem dos arquivos "emplacamento de importados/nacionais
        por empresa e marca" (raw_anfavea_origin_brand_monthly), publicados para 2026.
    - name: raw_comex_stat_china_automotive
      source: Comex Stat/MDIC
      path: data/raw/comex_stat/
      format: csv_or_api_export
      grain: monthly by ncm and country
      owner: A definir
      update_frequency: monthly
      pii: false
    - name: raw_caam_china_auto_market
      source: CAAM
      path: data/raw/caam/
      format: html_pdf_or_spreadsheet
      grain: monthly market aggregates when available
      owner: A definir
      update_frequency: monthly
      pii: false
      role: evidence_source
    - name: raw_cpca_china_passenger_car_market
      source: CPCA
      path: data/raw/cpca/
      format: html_pdf_or_spreadsheet
      grain: monthly passenger car market by maker/brand when available
      owner: A definir
      update_frequency: monthly
      pii: false
      role: evidence_source
  interim: []
  processed: []
  curated:
    - name: gold_anfavea_chinese_registrations_monthly
      source: ANFAVEA
      grain: monthly
      owner: A definir
      pii: false
      notes: >-
        Serie em banda: emplacamentos_chinesas_min (piso, marcas confirmadas) e
        emplacamentos (estimativa/teto, com linha "Outras empresas" como proxy nos
        meses sem detalhe). Coluna metodo_outras indica a origem do valor.
    - name: gold_anfavea_chinese_registrations_by_brand_monthly
      source: ANFAVEA
      grain: monthly by brand and vehicle_group
      owner: A definir
      pii: false
      notes: Detalhe por marca; coluna fonte distingue workbook anual de arquivos por marca.
    - name: gold_anfavea_chinese_registrations_by_segment_monthly
      source: ANFAVEA
      grain: monthly by vehicle_group
      owner: A definir
      pii: false
      notes: >-
        Serie por segmento (automoveis, comerciais leves, caminhoes, onibus) em banda
        piso/estimativa. Base do comparativo de estoque no canal contra os prefixos NCM
        do Comex (8703 automoveis, 8704 carga, 8702 onibus).
    - name: gold_comex_china_automotive_monthly
      source: Comex Stat/MDIC
      grain: monthly by ncm
      owner: A definir
      pii: false
      notes: >-
        Metrica principal quantidade_veiculos (unidades de NCMs de veiculos completos
        medidos em unidade estatistica 11); valor_fob_usd e kg_liquido como secundarias.

