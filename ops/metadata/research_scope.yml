research_scope:
  questions:
    - id: anfavea_chinese_registrations
      source: ANFAVEA
      period_start: 2021-01
      period_end: latest_available_2026
      grain: monthly
      subject: emplacamentos de carros chineses
      output_tables:
        - gold_anfavea_chinese_registrations_monthly
        - gold_anfavea_chinese_registrations_by_brand_monthly
    - id: comex_china_automotive
      source: Comex Stat/MDIC
      period_start: 2021-01
      period_end: 2026-06
      grain: monthly
      country: China
      ncm_codes:
        - "8702"
        - "8703"
        - "8704"
        - "8706"
        - "8707"
        - "8708"
        - "87011"
      unresolved_items:
        - Confirmar se o fluxo desejado e importacao, exportacao ou ambos.
        - Confirmar se 87011 e um codigo intencional, prefixo ou erro de digitacao.
  auxiliary_sources:
    - id: caam
      name: China Association of Automobile Manufacturers
      role: Contexto e validacao cruzada da industria automotiva chinesa.
      official_url: http://www.caam.org.cn/
      does_not_replace:
        - ANFAVEA para emplacamentos no Brasil.
        - Comex Stat/MDIC para comercio exterior Brasil-China.
    - id: cpca
      name: China Passenger Car Association
      role: Contexto, rankings e dados de automoveis de passageiros na China.
      official_url: https://www.cpcaauto.com/
      data_url: https://data.cpcadata.com/
      does_not_replace:
        - ANFAVEA para emplacamentos no Brasil.
        - Comex Stat/MDIC para comercio exterior Brasil-China.
